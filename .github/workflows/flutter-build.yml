name: Build Flutter App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
    build-flutter:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: 'zulu'
            java-version: '17'

        - name: Set up Flutter
          uses: subosito/flutter-action@v2
          with:
            flutter-version: '3.x'
            channel: 'stable'
            cache: true

        - name: Install Dependencies
          run: flutter pub get

        - name: Run Build
          run: flutter build web
