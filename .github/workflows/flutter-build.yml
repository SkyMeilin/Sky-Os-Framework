name: Build Flutter Apps

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'flutter-app/**'
      - 'client_flutter/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'flutter-app/**'
      - 'client_flutter/**'

jobs:
  build-flutter-app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - name: "SkyOS Overlay"
            path: "flutter-app"
          - name: "Open Core Scanner"
            path: "client_flutter"
    name: "Build ${{ matrix.app.name }}"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ matrix.app.path }}-${{ hashFiles(format('{0}/pubspec.lock', matrix.app.path)) }}

      - name: Verify Flutter version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get
        working-directory: ${{ matrix.app.path }}

      - name: Run Static Analysis
        run: flutter analyze
        working-directory: ${{ matrix.app.path }}

      - name: Check Code Formatting
        run: flutter format --set-exit-if-changed .
        working-directory: ${{ matrix.app.path }}

      - name: Run Tests
        run: flutter test
        working-directory: ${{ matrix.app.path }}
        continue-on-error: false

      - name: Build for Web
        run: flutter build web --release
        working-directory: ${{ matrix.app.path }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-web-build
          path: ${{ matrix.app.path }}/build/web
          retention-days: 7
