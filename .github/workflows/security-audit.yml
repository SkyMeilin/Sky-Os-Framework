name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install bandit safety

      - name: Run Bandit (SAST)
        run: |
          bandit -r backend_python/app/ open-core/ -ll || true

      - name: Check for outdated packages
        run: |
          safety check -r backend_python/app/requirements.txt || true
