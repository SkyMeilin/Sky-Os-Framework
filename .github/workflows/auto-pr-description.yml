name: Auto PR Description

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, master, develop]

jobs:
  auto-description:
    name: Auto-Generate PR Description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate PR Title and Description
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTPUT_FILE: /tmp/pr-output.txt
        run: python3 scripts/auto_pr_description.py

      - name: Update Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            
            // Lese die generierte Ausgabe
            const outputContent = fs.readFileSync('/tmp/pr-output.txt', 'utf8');
            
            // Parse TITLE
            const titleMatch = outputContent.match(/^TITLE=(.+)$/m);
            const title = titleMatch ? titleMatch[1] : 'Pull Request';
            
            // Parse DESCRIPTION
            const descStart = outputContent.indexOf('DESCRIPTION_START\n') + 'DESCRIPTION_START\n'.length;
            const descEnd = outputContent.indexOf('\nDESCRIPTION_END');
            const body = outputContent.substring(descStart, descEnd);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              title: title,
              body: body
            });

            console.log(`PR #${prNumber} wurde erfolgreich aktualisiert.`);
