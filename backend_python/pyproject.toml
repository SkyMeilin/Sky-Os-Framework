[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skyos-open-core-backend"
version = "0.1.0"
description = "SkyOS Open Core Backend API - Behördenbescheid-OCR, Notfall-Leitfäden, DSGVO-Anonymisierung"
readme = "../README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
db = [
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.31",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]
dev = [
    "skyos-open-core-backend[test]",
    "black>=24.4.2",
    "flake8>=7.1.0",
    "mypy>=1.10.0",
]

[project.scripts]
skyos-backend = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
